name: Windows native checks
on:
  workflow_call:
  # workflow_dispatch:
  # push:
  #   branches: ["**"]
  #   paths:
  #     - "packages/megaladata-host/**"
  #     - "packages/desktop/src/main/apps.ts"
  #     - "packages/desktop/src/main/apps.test.ts"
  #     - "packages/agent/src/cli/profile-windows.ts"
  #     - "packages/agent/test/cli/profile-windows.test.ts"
  #     - "script/test-windows-profile.ps1"
  #     - ".github/workflows/windows-native-check.yml"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked native test dependencies
        run: bun install --frozen-lockfile --linker hoisted --ignore-scripts --filter '@megaladata-ai-agent/megaladata-host'
      - name: Verify native host
        working-directory: packages/megaladata-host
        run: |
          $env:MEGALADATA_AI_AGENT_TEST_NODE = (Get-Command node).Source
          bun typecheck
          if ($LASTEXITCODE -ne 0) { throw "Host typecheck failed" }
      - name: Verify native application resolution in fresh processes
        working-directory: packages/desktop
        run: |
          # Each repetition must pass; these are independent cold starts, not retries.
          1..5 | ForEach-Object {
            bun test src/main/apps.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Native application resolution failed on repetition $_" }
          }
      - name: Read system proxy
        run: bun packages/megaladata-host/script/system-proxy-smoke.ts
